[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-localizer"
version = "0.1.0"
description = "Local-first Korean video text localization pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "popop25" }]
dependencies = [
  "Pillow>=11,<13",
  "psutil>=6,<8",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-Pillow>=10,<13",
  "types-psutil>=6,<8",
  "types-PyYAML>=6,<7",
]
ocr = [
  "paddleocr>=3.3,<4",
  "paddlepaddle==3.3.0",
  "truststore>=0.10,<1",
]
translation = [
  "huggingface-hub>=0.30,<2",
  "sentencepiece>=0.2,<1",
  "torch>=2.7,<3",
  "transformers>=4.52,<5",
  "truststore>=0.10,<1",
]

[project.scripts]
text-localizer = "text_localizer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
