schema_version: 1
name: browser-lecture-content
glossary: ../glossary.ko-ja.yaml

analysis:
  roi:
    x: 0.22
    y: 0.16
    width: 0.75
    height: 0.84
  exclude_regions:
    - x: 0.22
      y: 0.37
      width: 0.75
      height: 0.15
    - x: 0.84
      y: 0.78
      width: 0.13
      height: 0.22
  min_region_height: 0.015
  group_adjacent: true
  translation_batch_size: 4

scene_detection:
  hash_size: 16
  hamming_threshold: 18

visual_events:
  sample_interval_seconds: 0.2
  analysis_width: 384
  tile_columns: 12
  tile_rows: 8
  tile_change_threshold: 0.02
  minimum_changed_tiles: 1
  global_change_ratio: 0.35
  exclude_regions:
    - x: 0.84
      y: 0.78
      width: 0.13
      height: 0.22
